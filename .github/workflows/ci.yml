# CI workflow for Homebrew formula validation
#
# Triggers:
#   - Pull requests and pushes to main (path-filtered)
#   - workflow_dispatch with optional perform-install flag
#
# Jobs:
#   lint      - Ruby syntax/style check (always runs)
#   audit     - brew audit (non-blocking for placeholder, blocking for real versions)
#   install   - brew install + test (conditional, requires perform-install=true)
#
# Docs-only changes (README.md, CONTRIBUTING.md, etc.) skip all formula jobs.

name: CI

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      perform-install:
        description: "Run brew install + brew test"
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_DEVELOPER: 1

jobs:
  lint:
    name: Ruby style check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Run brew style
        run: |
          brew style Formula/

  audit:
    name: Formula audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        env:
          GITHUB_ACTIONS_HOMEBREW_SELF_HOSTED: 1

      - name: Tap self (required for brew audit)
        run: |
          brew untap AniTrend/tap 2>/dev/null || true
          brew tap --force AniTrend/tap "${{ github.workspace }}"
          brew trust --formula AniTrend/tap/stackctl

      - name: Detect placeholder release
        id: version-check
        run: |
          release_tags=()
          while IFS= read -r release_url; do
            if [[ "$release_url" =~ /download/(v[0-9]+\.[0-9]+\.[0-9]+)/ ]]; then
              tag="${BASH_REMATCH[1]}"
              seen=false
              for existing in "${release_tags[@]}"; do
                if [ "$existing" = "$tag" ]; then
                  seen=true
                  break
                fi
              done
              if [ "$seen" = "false" ]; then
                release_tags+=("$tag")
              fi
            fi
          done < <(grep -Eo 'https://github\.com/AniTrend/stackctl/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/[^"[:space:]]+' Formula/stackctl.rb || true)

          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "Expected at least one stackctl release URL in Formula/stackctl.rb, found 0" >&2
            exit 1
          fi

          if [ "${#release_tags[@]}" -ne 1 ]; then
            echo "Expected exactly one stackctl release tag in Formula/stackctl.rb, found ${#release_tags[@]}" >&2
            printf '%s\n' "${release_tags[@]}" >&2
            exit 1
          fi

          if [ "${release_tags[0]}" = "v0.0.0" ]; then
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
          else
            echo "placeholder=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run brew audit
        env:
          IS_PLACEHOLDER: ${{ steps.version-check.outputs.placeholder }}
        run: |
          set +o pipefail
          brew audit --strict --online AniTrend/tap/stackctl 2>&1 \
            | tee "${{ runner.temp }}/brew-audit.log"
          audit_status=${PIPESTATUS[0]}
          set -o pipefail
          # Skip exit code check for placeholder versions (0.0.0).
          # For real versions, audit failures are blocking.
          if [ "${IS_PLACEHOLDER}" = "true" ]; then
            echo "Audit completed (placeholder, non-blocking)"
            exit 0
          fi
          exit "$audit_status"

      - name: Upload audit log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-log
          path: "${{ runner.temp }}/brew-audit.log"
          retention-days: 7

  install:
    name: Install and test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.perform-install == true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        env:
          GITHUB_ACTIONS_HOMEBREW_SELF_HOSTED: 1

      - name: Tap self
        run: |
          brew untap AniTrend/tap 2>/dev/null || true
          brew tap --force AniTrend/tap "${{ github.workspace }}"
          brew trust --formula AniTrend/tap/stackctl

      - name: Install formula
        run: |
          brew install --formula AniTrend/tap/stackctl

      - name: Test formula
        run: |
          brew test AniTrend/tap/stackctl
